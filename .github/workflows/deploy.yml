# main 에 push 하면 사이트 파일을 VPS 배포 폴더로 올린다(https://chagok.novum-lab.com).
# 서버 값은 저장소 secret 으로만 받는다 — 값을 이 파일에 적지 않는다.
#   DEPLOY_HOST        서버 주소
#   DEPLOY_USER        배포 전용 사용자(sudo 없음, 배포 폴더만 쓰기)
#   DEPLOY_PATH        배포 폴더 기준 경로 — 서버 키가 rrsync 로 묶여 있어 / 를 쓴다
#   DEPLOY_SSH_KEY     그 사용자의 SSH 개인 키(배포 전용)
#   DEPLOY_KNOWN_HOSTS 서버 호스트 키 한 줄 이상(ssh-keyscan 결과) — 낯선 서버로는 올리지 않는다
# 검색 차단(noindex) 헤더는 서버 Caddy 블록이 붙인다(README "게시").
name: 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH 준비
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: VPS 로 올리기
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        # --checksum: checkout 이 파일 시각을 바꾸므로 내용으로 비교한다
        # --delete: 레포에서 지운 파일은 서버에서도 지운다(제외한 파일은 지우지 않는다)
        run: |
          rsync -rlz --checksum --delete --delay-updates --chmod=D755,F644 \
            --exclude '.git' --exclude '.github' --exclude 'README.md' --exclude '_headers' --exclude '.nojekyll' \
            -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:${DEPLOY_PATH%/}/"

      - name: 키 지우기
        if: always()
        run: rm -f ~/.ssh/deploy_key
